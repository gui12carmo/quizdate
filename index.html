<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Something for You 💌</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #1a0a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart-float {
      position: absolute;
      bottom: -50px;
      font-size: 1.2rem;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      padding: 20px;
    }

    /* ── LANGUAGE SWITCH ── */
    .lang-switch {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .lang-btn {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 6px 20px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: rgba(232,121,249,0.2);
      border-color: #e879f9;
      color: #fff;
    }
    .lang-btn:hover:not(.active) {
      border-color: rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.85);
    }
    .lang-sep { color: rgba(255,255,255,0.2); font-size: 0.9rem; }

    /* ── SCREENS ── */
    .screen { display: none; animation: fadeIn 0.6s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── CARD ── */
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      text-align: center;
    }

    .card .emoji-big { font-size: 4rem; margin-bottom: 16px; display: block; }

    h1 {
      color: #fff;
      font-size: 2rem;
      font-weight: normal;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h2 {
      color: #e8c5f0;
      font-size: 1.35rem;
      font-weight: normal;
      margin-bottom: 8px;
    }
    p {
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap { margin-bottom: 28px; }
    .progress-label {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .progress-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #e879f9, #fb923c);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* ── OPTIONS ── */
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }
    .options.single-col { grid-template-columns: 1fr; }

    .option-btn {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 16px 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }
    .option-btn:hover {
      background: rgba(232,121,249,0.2);
      border-color: #e879f9;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232,121,249,0.25);
    }
    .option-btn.selected {
      background: linear-gradient(135deg, rgba(232,121,249,0.3), rgba(251,146,60,0.3));
      border-color: #e879f9;
      box-shadow: 0 0 0 2px rgba(232,121,249,0.4);
    }
    .option-btn .opt-icon { font-size: 1.4rem; flex-shrink: 0; }

    /* ── TEXT ANSWER ── */
    .text-answer {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      padding: 18px 20px;
      resize: none;
      outline: none;
      line-height: 1.7;
      transition: border-color 0.25s, box-shadow 0.25s;
      margin-top: 12px;
    }
    .text-answer:focus {
      border-color: #e879f9;
      box-shadow: 0 0 0 2px rgba(232,121,249,0.2);
    }
    .text-answer::placeholder { color: rgba(255,255,255,0.28); }

    /* ── BUTTONS ── */
    .btn-primary {
      display: inline-block;
      margin-top: 28px;
      padding: 16px 48px;
      background: linear-gradient(135deg, #e879f9, #fb923c);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 32px rgba(232,121,249,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(232,121,249,0.5);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 28px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
    }
    .btn-ghost:hover { border-color: #e879f9; color: #e879f9; }

    /* ── RESULT SCREEN ── */
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 24px 0;
      text-align: left;
    }
    .result-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px;
    }
    .result-item .r-label {
      color: rgba(255,255,255,0.45);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .result-item .r-value { color: #f0d4ff; font-size: 0.95rem; }

    .final-msg {
      background: linear-gradient(135deg, rgba(232,121,249,0.15), rgba(251,146,60,0.15));
      border: 1px solid rgba(232,121,249,0.3);
      border-radius: 16px;
      padding: 20px 24px;
      color: #fff;
      font-size: 1rem;
      line-height: 1.7;
      margin: 20px 0;
    }

    .stars {
      color: #e879f9;
      font-size: 1.3rem;
      letter-spacing: 4px;
      margin: 8px 0;
    }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 14px 32px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-copy:hover {
      background: rgba(255,255,255,0.15);
      border-color: #e879f9;
      color: #e879f9;
    }
    .btn-copy.copied {
      background: rgba(52,211,153,0.15);
      border-color: #34d399;
      color: #34d399;
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 1.6rem; }
      .options { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="container">

  <!-- Language switcher -->
  <div class="lang-switch">
    <button class="lang-btn active" id="lang-en" onclick="setLang('en')">English</button>
    <span class="lang-sep">|</span>
    <button class="lang-btn" id="lang-eu" onclick="setLang('eu')">Euskara</button>
  </div>

  <!-- ── INTRO ── -->
  <div class="screen active" id="screen-intro">
    <div class="card">
      <span class="emoji-big">💌</span>
      <h1 id="intro-h1"></h1>
      <p id="intro-p"></p>
      <p id="intro-count" style="font-size:0.85rem; color:rgba(255,255,255,0.4);"></p>
      <button class="btn-primary" id="intro-btn" onclick="startQuiz()"></button>
    </div>
  </div>

  <!-- ── QUESTIONS ── -->
  <div class="screen" id="screen-quiz">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-label" id="progress-label"></div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:14%"></div>
        </div>
      </div>

      <h2 id="q-text"></h2>
      <p id="q-sub" style="margin-bottom:0; font-size:0.88rem;"></p>

      <div class="options" id="options-container"></div>

      <div style="display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap;">
        <button class="btn-ghost" onclick="prevQuestion()" id="btn-back"></button>
        <button class="btn-primary" onclick="nextQuestion()" id="btn-next" disabled></button>
      </div>
    </div>
  </div>

  <!-- ── RESULT ── -->
  <div class="screen" id="screen-result">
    <div class="card">
      <span class="emoji-big" id="result-emoji">🎉</span>
      <h1 id="result-title"></h1>
      <div class="stars">★ ★ ★ ★ ★</div>
      <p id="result-subtitle"></p>

      <div class="result-grid" id="result-grid"></div>

      <div class="final-msg" id="final-msg"></div>

      <p id="copy-hint" style="color:rgba(255,255,255,0.45); font-size:0.8rem; margin-bottom:4px;"></p>
      <button class="btn-copy" id="btn-copy" onclick="copyAnswers()">
        <span id="copy-icon">📋</span><span id="copy-btn-text"></span>
      </button>
      <br/>
      <button class="btn-ghost" id="restart-btn" onclick="restart()"></button>
    </div>
  </div>

</div>

            { icon: "🌙", label: "Gauez" },

        {

          text: "Zer dago zerrendan?",
          sub: "Gauaren soinu-banda",
          cols: 2,
          options: [
            { icon: "🎷", label: "Jazz / Lo-fi" },
            { icon: "🎸", label: "Indie / Alternatiboa" },
            { icon: "💿", label: "Pop / R&B" },
            { icon: "🎵", label: "Momentuak esaten duena" },
          ]
        },
        {
          id: "important",
          type: "text",
          text: "Zer da zuretzat garrantzitsuena date batean?",
          sub: "Esan iezadazu zure hitzetan... 💭",
          placeholder: "Idatzi gogora datorkizuna...",
          cols: 1,
        },
      ],
    },
  };

  const answers = {};
  let current = 0;

  function t(key) { return i18n[lang][key]; }
  function getQuestions() { return i18n[lang].questions; }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function setLang(newLang) {
    lang = newLang;
    document.title = t('page_title');
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    document.getElementById('lang-eu').classList.toggle('active', lang === 'eu');

    const active = document.querySelector('.screen.active');
    if (active.id === 'screen-quiz') {
      renderQuestion();
    } else if (active.id === 'screen-result') {
      showResult();
    } else {
      renderIntro();
    }
  }

  function renderIntro() {
    document.getElementById('intro-h1').textContent    = t('intro_h1');
    document.getElementById('intro-p').innerHTML       = t('intro_p');
    document.getElementById('intro-count').textContent = t('intro_count');
    document.getElementById('intro-btn').textContent   = t('intro_btn');
  }

  function spawnHearts() {
    const bg = document.getElementById('heartsBg');
    const emojis = ['🍚','🥚','🍳','🍚','🥚','🍳'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'heart-float';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (10 + Math.random() * 18) + 's';
      el.style.animationDelay = (Math.random() * 15) + 's';
      el.style.fontSize = (0.8 + Math.random() * 1) + 'rem';
      bg.appendChild(el);
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
  }

  function startQuiz() {
    current = 0;
    renderQuestion();
    showScreen('quiz');
  }

  function renderQuestion() {
    const questions = getQuestions();
    const q = questions[current];

    document.getElementById('progress-label').textContent =
      t('progress_label').replace('{n}', current + 1).replace('{total}', questions.length);
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('q-sub').textContent  = q.sub;

    const fill = ((current + 1) / questions.length) * 100;
    document.getElementById('progress-fill').style.width = fill + '%';

    document.getElementById('btn-back').textContent = t('btn_back');
    document.getElementById('btn-back').style.display = current === 0 ? 'none' : 'inline-block';
    document.getElementById('btn-next').textContent = t('btn_continue');

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (q.type === 'text') {
      container.className = 'options single-col';
      const ta = document.createElement('textarea');
      ta.className = 'text-answer';
      ta.placeholder = q.placeholder;
      ta.rows = 5;
      ta.value = answers[q.id] || '';
      ta.oninput = () => {
        answers[q.id] = ta.value;
        document.getElementById('btn-next').disabled = !ta.value.trim();
      };
      container.appendChild(ta);
      document.getElementById('btn-next').disabled = !(answers[q.id] && answers[q.id].trim());
      return;
    }

    container.className = 'options' + (q.cols === 1 ? ' single-col' : '');
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn' + (answers[q.id] === idx ? ' selected' : '');
      btn.innerHTML = `<span class="opt-icon">${opt.icon}</span><span>${opt.label}</span>`;
      btn.onclick = () => selectOption(q.id, idx);
      container.appendChild(btn);
    });

    document.getElementById('btn-next').disabled = answers[q.id] === undefined;
  }

  function selectOption(qId, idx) {
    answers[qId] = idx;
    document.querySelectorAll('#options-container .option-btn').forEach((btn, i) => {
      btn.classList.toggle('selected', i === idx);
    });
    document.getElementById('btn-next').disabled = false;
  }

  function nextQuestion() {
    const questions = getQuestions();
    const q = questions[current];
    if (q.type === 'text') {
      if (!answers[q.id] || !answers[q.id].trim()) return;
    } else {
      if (answers[q.id] === undefined) return;
    }
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function prevQuestion() {
    if (current > 0) { current--; renderQuestion(); }
  }

  function showResult() {
    const questions = getQuestions();
    const T = i18n[lang];

    const vibeIdx = answers["vibe"] ?? 0;
    document.getElementById('result-emoji').textContent   = T.result_emojis[vibeIdx];
    document.getElementById('result-title').textContent   = T.result_titles[vibeIdx];
    document.getElementById('result-subtitle').textContent = T.result_subtitle;

    const ids    = ["vibe","setting","food","activity","time","music","important"];
    const labels = T.result_labels;
    const grid   = document.getElementById('result-grid');
    grid.innerHTML = '';

    ids.forEach((id, i) => {
      const q = questions.find(q => q.id === id);
      const div = document.createElement('div');
      div.className = 'result-item';

      if (q.type === 'text') {
        const raw = answers[id] || '';
        const display = raw.length > 80 ? raw.slice(0, 77) + '…' : raw;
        div.innerHTML = `<div class="r-label">${labels[i]}</div>
                         <div class="r-value" style="font-size:0.88rem; font-style:italic;">"${esc(display)}"</div>`;
        div.style.gridColumn = '1 / -1';
      } else {
        const opt = q.options[answers[id]];
        div.innerHTML = `<div class="r-label">${labels[i]}</div>
                         <div class="r-value">${opt.icon} ${opt.label}</div>`;
      }
      grid.appendChild(div);
    });

    const importantText = answers["important"] || "—";
    document.getElementById('final-msg').innerHTML =
      `${T.final_prefix}<br/>
       <strong style="color:#f0d4ff; font-size:1.05rem;">"${esc(importantText)}"</strong>
       <br/><br/>${T.final_suffix}`;

    document.getElementById('copy-hint').textContent    = T.copy_hint;
    document.getElementById('copy-btn-text').textContent = T.copy_btn;
    document.getElementById('restart-btn').textContent   = T.restart_btn;

    showScreen('result');
  }

  function copyAnswers() {
    const questions = getQuestions();
    const T = i18n[lang];
    const ids    = ["vibe","setting","food","activity","time","music","important"];
    const labels = T.copy_labels;

    const lines = ids.map((id, i) => {
      const q = questions.find(q => q.id === id);
      if (q.type === 'text') return `💭 *${labels[i]}:* ${answers[id] || '—'}`;
      const opt = q.options[answers[id]];
      return `${opt.icon} *${labels[i]}:* ${opt.label}`;
    });

    const text = `${T.copy_header}\n\n${lines.join('\n')}\n\n${T.copy_footer}`;

    function markCopied() {
      const btn = document.getElementById('btn-copy');
      btn.classList.add('copied');
      document.getElementById('copy-icon').textContent    = '✅';
      document.getElementById('copy-btn-text').textContent = T.copied_btn;
      setTimeout(() => {
        btn.classList.remove('copied');
        document.getElementById('copy-icon').textContent    = '📋';
        document.getElementById('copy-btn-text').textContent = T.copy_btn;
      }, 3000);
    }

    navigator.clipboard.writeText(text).then(markCopied).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      markCopied();
    });
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    current = 0;
    renderIntro();
    showScreen('intro');
  }

  // Init
  spawnHearts();
  renderIntro();
</script>
</body>
</html>
